name: Release APK

# 在 GitHub 上创建标签并发布 Release 后自动触发：
# 混淆构建 arm64 / armeabi-v7a 两个 APK，签名后上传到该 Release 附件。
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 secret。本地执行 base64 -w0 keystore/xunyuan-release.jks，把结果存入仓库 Settings→Secrets→Actions 的 KEYSTORE_BASE64；另配 KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD。"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/xunyuan-release.jks"

      - name: Write android/key.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/keystore/xunyuan-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - run: flutter pub get

      - name: Build obfuscated split APKs
        run: >
          flutter build apk --release
          --obfuscate --split-debug-info=build/symbols
          --split-per-abi

      - name: Rename artifacts
        run: |
          tag="${GITHUB_REF_NAME}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "寻源_${tag}_arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "寻源_${tag}_armv7.apk"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "寻源_${GITHUB_REF_NAME}_arm64.apk" \
            "寻源_${GITHUB_REF_NAME}_armv7.apk" \
            --clobber

      - name: Keep debug symbols for crash symbolization
        uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ github.ref_name }}
          path: build/symbols/
          retention-days: 90
